name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    # macos-26 runners are scarce enough that jobs sat queued until GitHub cancelled them.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The helper uses macOS 26 APIs (SpeechAnalyzer), so it needs the macOS 26 SDK.
      - name: Use Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install the Metal toolchain
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: cargo build --locked
      - run: cargo test --locked

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --locked
      - run: cargo test --locked
      - uses: actions/upload-artifact@v5
        with:
          name: scrawl-windows-x86_64
          path: target/debug/scrawl.exe
