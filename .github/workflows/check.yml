name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    # Draft PRs take no runner time; marking one ready for review runs the checks.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # macos-26 runners are scarce enough that jobs sat queued until GitHub cancelled them.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # build.rs compiles the helper's macOS 26 code (SpeechAnalyzer, glass) only with the macOS 26
      # SDK; without it CI would pass without building that code.
      - name: Use Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then echo "::error::No Xcode 26 on this runner image"; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install the Metal toolchain
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: cargo build --locked
      - run: cargo test --locked

  windows:
    name: Windows
    # Draft PRs take no runner time; marking one ready for review runs the checks.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --locked
      - run: cargo test --locked
      - uses: actions/upload-artifact@v5
        with:
          name: scrawl-windows-x86_64
          path: target/debug/scrawl.exe
